<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCard Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
	<div class="music-btn">
  <i class="fas fa-music" id="music-logo"></i>
  <i class="fas fa-pause" id="play-btn"></i>
  <i class="fas fa-forward" id="next-btn"></i>
</div>
    <div class="vcard-container">
<div class="background-section">
  <img src="./assets/images/banner.webp" alt="Banner" class="banner-image">
</div>
        <div class="profile-image-container">
    <img src="./assets/images/profile.webp" alt="Profile" class="profile-image">
</div>
<div class="content-section">
            <h1 class="name" id="name"></h1>
            <div class="bio" id="bio"></div>
            <div class="hobbies-section">
                <div class="hobbies-title">Hobbies</div>
                <div class="hobbies-container" id="hobbies-container"></div>
            </div>
<div class="social-section">
    <div class="social-title">Media Social</div>
    <div class="social-buttons">
        <div class="social-btn whatsapp" id="whatsapp-btn">
            <img src="./assets/images/btn-wa.webp" alt="WhatsApp">
        </div>
        <div class="social-btn telegram" id="telegram-btn">
            <img src="./assets/images/btn-tlg.webp" alt="Telegram">
        </div>
        <div class="social-btn github" id="github-btn">
            <img src="./assets/images/btn-git.webp" alt="GitHub">
        </div>
        <div class="social-btn discord" id="discord-btn">
            <img src="./assets/images/btn-dc.webp" alt="Discord">
        </div>
    </div>
</div>
            <div class="redirect-section">
                <div class="redirect-title">Redirect</div>
                <div class="redirect-buttons" id="redirect-buttons"></div>
            </div>
        </div>
        <footer>elyn.my.id © 2025</footer>
    </div>
    <audio id="audio-player"></audio>
    <script src="./mainU1RSVUNUID0gVGlrdG9rIFZlcnNpb24ud2VibQ==.js"></script>
</body>
</html>
